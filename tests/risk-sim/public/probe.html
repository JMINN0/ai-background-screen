<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环境指纹探针</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1116; color: #e8eaf0; }
  .wrap { padding: 14px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 4px 0 3px; }
  .sub { font-size: 11px; color: #8b93a7; margin-bottom: 14px; line-height: 1.5; }
  .card { background: #181c24; border: 1px solid #262d3b; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .h { font-size: 12px; color: #7aa2f7; margin-bottom: 8px; letter-spacing: .3px; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button { padding: 11px 14px; font-size: 14px; border-radius: 8px; border: 1px solid #333b4d;
           background: #232a36; color: #e8eaf0; cursor: pointer; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  #out { font-family: ui-monospace, monospace; font-size: 10.5px; line-height: 1.55;
         white-space: pre-wrap; word-break: break-all; color: #9fb4d4; max-height: 420px; overflow: auto; }
  .verdict { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
  .v-bot { background: #4a1d22; border: 1px solid #7d2b33; color: #ff9aa5; }
  .v-sus { background: #4a3d1d; border: 1px solid #7d6a2b; color: #ffd98a; }
  .v-ok  { background: #1d4a2b; border: 1px solid #2b7d46; color: #8ce0a8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>环境指纹探针</h1>
  <div class="sub">
    这个页面只做一件事：把「页面能读到、能用来判断你不是真人真机」的信号全部列出来。
    不评判对错，先看清楚到底暴露了什么。
  </div>

  <div class="card">
    <div class="h">先做几次交互（点击、拖动、打字），再跑检测</div>
    <input id="user" placeholder="随便打几个字" autocomplete="off">
    <div class="row">
      <button class="primary" id="b1">按钮一</button>
      <button id="b2">按钮二</button>
      <button id="b3">按钮三</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button class="primary" id="run">跑检测</button>
      <button id="reset">清空记录</button>
    </div>
  </div>

  <div id="verdict"></div>
  <div class="card"><div id="out">还没跑。</div></div>
</div>

<script src="/probe.js"></script>
<script>
  document.getElementById('run').addEventListener('click', () => {
    const r = window.EnvProbe.run();
    const v = document.getElementById('verdict');
    v.className = 'verdict ' + (r.verdict.level === 'bot' ? 'v-bot'
      : r.verdict.level === 'sus' ? 'v-sus' : 'v-ok');
    v.textContent = `判定：${r.verdict.label} —— ${r.verdict.action}（暴露分 ${r.exposure}/100，越高越像机器）`;

    const lines = [];
    lines.push('—— 命中的暴露信号 ——');
    const hit = r.signals.filter((s) => s.hit);
    if (!hit.length) lines.push('（无）');
    hit.forEach((s) => lines.push(`⚠️ [${s.severity}] ${s.id}: ${s.detail}`));
    lines.push('');
    lines.push('—— 全部信号 ——');
    r.signals.forEach((s) => lines.push(`${s.hit ? '⚠️' : '✅'} [${s.severity}] ${s.id}: ${s.detail}`));
    lines.push('');
    lines.push('—— 原始值 ——');
    lines.push(JSON.stringify(r.raw, null, 1));
    document.getElementById('out').textContent = lines.join('\n');
    window.__probeLast = r;
  });
  document.getElementById('reset').addEventListener('click', () => {
    window.EnvProbe.reset();
    document.getElementById('out').textContent = '已清空。';
    document.getElementById('verdict').textContent = '';
  });
  ['b1', 'b2', 'b3'].forEach((id) => {
    document.getElementById(id).addEventListener('click', (e) => {
      e.target.style.background = '#1f6feb';
      setTimeout(() => { e.target.style.background = ''; }, 140);
    });
  });
</script>
</body>
</html>
